<script>
  // Reenvía solo los parámetros permitidos, saneados igual que doGet() de la app.
  (function () {
    var src = "https://script.google.com/macros/s/AKfycbxV0BlsXNE5u6eW7Q46RZhh5S2BrrOMyuQ1WMhV5C2-Iat-WHHauQnnfEm-tsbVWs5OsQ/exec?v=visualizador";
    var permitidos = {};
    var entrada = new URLSearchParams(location.search);
    Object.keys(permitidos).forEach(function (k) {
      var valor = (entrada.get(k) || '').replace(/[^A-Za-z0-9_]/g, '');
      if (valor) src += (src.indexOf('?') > -1 ? '&' : '?') + permitidos[k] + '=' + encodeURIComponent(valor);
    });
    document.getElementById('app').src = src;
  })();

  // Pantalla de carga: se quita cuando el marco termina de abrir; si tarda, avisa y ofrece reintentar.
  (function () {
    var marco = document.getElementById('app'), carga = document.getElementById('carga-portal');
    var lento = carga.querySelector('.lento'), temporizador;
    function esperar() {
      lento.hidden = true;
      carga.hidden = false;
      clearTimeout(temporizador);
      temporizador = setTimeout(function () { lento.hidden = false; }, 12000);
    }
    marco.addEventListener('load', function () { clearTimeout(temporizador); carga.hidden = true; });
    document.getElementById('reintentar').addEventListener('click', function () { esperar(); marco.src = marco.src; });
    esperar();
  })();
</script>
